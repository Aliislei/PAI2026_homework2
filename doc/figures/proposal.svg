<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080" font-family="Hiragino Sans, sans-serif">
<rect x="150" y="460" width="1140" height="150" fill="#b2af8f" opacity=".32"/>
<text x="166" y="506" font-size="30" font-weight="600" fill="#3f3e30">14〜20cm</text>
<text x="166" y="548" font-size="26" fill="#3f3e30">計画が安定</text>
<rect x="150" y="660" width="1140" height="100" fill="#c9c9c9" opacity=".55"/>
